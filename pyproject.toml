[project]
name = "app"
version = "0.1.0"
description = "Project description"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []  # or dynamic = ["dependencies"] + [tool.setuptools.dynamic] to read from requirements.txt

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]
include = ["src*", "scripts*"]
